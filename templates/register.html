{% extends "base.html" %}
{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <h2>Create Account 🍕</h2>
        <p class="auth-sub">Join Smart Pizza today</p>

        <form action="/register" method="POST" class="auth-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="Ahmed Mohamed" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="01xxxxxxxxx" required>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" placeholder="123 Street, Cairo" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min 6 characters" required>
            </div>
            <button type="submit" class="btn btn-full">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>
    </div>
</section>

{% endblock %}
